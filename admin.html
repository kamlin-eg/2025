<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة طلبات كاملين</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body class="admin-body"><header class="admin-header"><div class="container"><a class="brand" href="index.html"><span class="brand-mark">ك</span><span><b>كاملين</b><small>لوحة إدارة الطلبات</small></span></a><a class="btn btn-outline" href="index.html">عرض الموقع</a></div></header><main class="container admin-main"><div class="admin-title"><div><span class="eyebrow">إدارة الحجوزات</span><h1>طلبات العملاء</h1><p>الطلبات محفوظة على هذا الجهاز فقط. عند ربط Supabase تصبح مشتركة بين جميع الأجهزة.</p></div><div><button class="btn btn-outline" id="exportBtn">تصدير CSV</button><button class="btn btn-danger" id="clearBtn">حذف الكل</button></div></div><div class="admin-stats"><div><b id="allCount">0</b><span>إجمالي الطلبات</span></div><div><b id="newCount">0</b><span>طلبات جديدة</span></div><div><b id="doneCount">0</b><span>مكتملة</span></div></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الخدمة</th><th>المنطقة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="bookingRows"></tbody></table><div id="emptyState" class="empty-state">لا توجد طلبات محفوظة حتى الآن.</div></div></main><script>
let bookings=JSON.parse(localStorage.getItem('kamlin_bookings')||'[]');
const rows=document.getElementById('bookingRows'), empty=document.getElementById('emptyState');
function render(){rows.innerHTML='';empty.style.display=bookings.length?'none':'block';bookings.forEach(b=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${new Date(b.createdAt).toLocaleString('ar-EG')}</td><td><b>${b.name}</b><small>${b.notes||''}</small></td><td><a href="tel:${b.phone}">${b.phone}</a></td><td>${b.service}</td><td>${b.area||'-'}</td><td><select onchange="statusChange(${b.id},this.value)"><option ${b.status==='جديد'?'selected':''}>جديد</option><option ${b.status==='تم التواصل'?'selected':''}>تم التواصل</option><option ${b.status==='مؤكد'?'selected':''}>مؤكد</option><option ${b.status==='مكتمل'?'selected':''}>مكتمل</option></select></td><td><button class="table-delete" onclick="removeItem(${b.id})">حذف</button></td>`;rows.appendChild(tr)});document.getElementById('allCount').textContent=bookings.length;document.getElementById('newCount').textContent=bookings.filter(x=>x.status==='جديد').length;document.getElementById('doneCount').textContent=bookings.filter(x=>x.status==='مكتمل').length;localStorage.setItem('kamlin_bookings',JSON.stringify(bookings));}
window.statusChange=(id,s)=>{bookings=bookings.map(x=>x.id===id?{...x,status:s}:x);render()};window.removeItem=id=>{if(confirm('حذف هذا الطلب؟')){bookings=bookings.filter(x=>x.id!==id);render()}};
document.getElementById('clearBtn').onclick=()=>{if(confirm('سيتم حذف جميع الطلبات من هذا الجهاز.')){bookings=[];render()}};
document.getElementById('exportBtn').onclick=()=>{if(!bookings.length)return alert('لا توجد بيانات');const heads=['التاريخ','الاسم','الهاتف','الخدمة','المنطقة','المساحة','الموعد','الملاحظات','الحالة'];const lines=[heads,...bookings.map(b=>[b.createdAt,b.name,b.phone,b.service,b.area,b.size,b.date,b.notes,b.status])].map(r=>r.map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kamlin-bookings.csv';a.click()};render();
</script></body></html>
